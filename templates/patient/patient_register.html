<!DOCTYPE html>
<html>
<head>
    <title>Patient Registration</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e6f2ff, #ffffff);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .register-card {
            max-width: 550px;
            margin: auto;
            margin-top: 60px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            background: #ffffff;
        }
        .hospital-title {
            color: #0d6efd;
            font-weight: 600;
            text-align: center;
            margin-bottom: 20px;
        }
        .btn-hospital {
            background-color: #0d6efd;
            border: none;
            width: 100%;
            font-weight: 500;
        }
        .btn-hospital:hover {
            background-color: #0b5ed7;
        }
        .login-link {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="register-card">
    <h2 class="hospital-title">🏥 Patient Registration</h2>

    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-hospital mt-3">Register</button>
    </form>

    <div class="login-link">
        <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
    </div>
</div>

</body>
</html>
