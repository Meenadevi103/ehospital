{% extends 'base.html' %}

{% block title %}Login - E-Hospitality{% endblock %}

{% block extra_css %}
<style>
    body {
        background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        min-height: 100vh;
    }

    .login-container {
        max-width: 400px;
        margin: 100px auto;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="login-container animate-up">
        <div class="glass-card">
            <h2 class="text-center mb-4 fw-bold">Login</h2>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-premium w-100 mt-3 py-3">Login</button>
            </form>
            <div class="text-center mt-4">
                <p>Don't have an account? <a href="{% url 'register' %}" class="text-primary fw-bold">Register</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
